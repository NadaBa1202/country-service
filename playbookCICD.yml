---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost
  connection: local

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service
    image_tag: v6
    dockerfile_path: './'
    full_image: "{{ dockerhub_username }}/{{ image_name }}"

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: yes
      no_log: true

    - name: Build Docker image
      community.docker.docker_image:
        build:
          path: "{{ dockerfile_path }}"
        name: "{{ full_image }}"
        tag: "{{ image_tag }}"
        source: build
        state: present

    - name: Push the Docker image to Docker Hub
      community.docker.docker_image:
        name: "{{ full_image }}"
        tag: "{{ image_tag }}"
        push: yes
        source: local

    - name: Pull Docker image (verification)
      community.docker.docker_image:
        name: "{{ full_image }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: deployment.yaml
        kubeconfig: config

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: service.yaml
        kubeconfig: config

    - name: Log out of Docker Hub
      community.docker.docker_login:
        state: absent
      no_log: true
